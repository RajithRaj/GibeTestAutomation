name: iOS

run-name: ${{ github.actor }} is learning build iOS App using Github Actions
on:
  push:
    branches:
      - dev-release
  pull_request:
    branches:
      - develop-uat

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: 21

      - name: Cache npm dependencies
        uses: actions/cache@v2
        with:
          path: "~/.npm"
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - run: npm ci
      - run: xcode-select -p

      - name: Cache pods
        uses: actions/cache@v1
        with:
          path: ios/Pods
          key: ${{ runner.OS }}-pods-cache-${{ hashFiles('**/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.OS }}-pods-cache-
      - run: pod install
        working-directory: ios
        name: Install pod dependencies

      - name: Build iOS (debug)
        run: "xcodebuild \
          -workspace ios/Gabibe.xcworkspace \
          -scheme Gabibe \
          clean archive \
          -sdk iphoneos \
          -configuration Debug \
          -UseModernBuildSystem=NO \
          -archivePath $PWD/HelloReactNative \
          CODE_SIGNING_ALLOWED=NO"

      - name: Compress .xcarchive
        run: zip -r -9 Gabibe.xcarchive.zip $PWD/Gabibe.xcarchive/

      - uses: actions/upload-artifact@v2
        with:
          name: ios-xarchive
          path: Gabibe.xcarchive.zip
